# Deploys Camox from main, then publishes the SDK when release-please cuts a release. Publishing
# waits for the deploy of the same commit, so no published SDK is ahead of the deployed API
# (ADR 0019), and each publish refreshes the Template that new projects fork.
name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Only main writes to the shared Nx cache; PR runs get a cache scoped to the PR.
env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

# Finish an active deployment; newer commits may replace a pending run.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Validate deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CAMOX_DEPLOY_TOKEN: ${{ secrets.CAMOX_DEPLOY_TOKEN }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CAMOX_DEPLOY_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing production secret: $name"
              exit 1
            fi
          done

      - run: pnpm install --frozen-lockfile

      # Build local workspace packages, including the unpublished SDK and CLI.
      - run: pnpm nx run-many -t build --projects=tag:type:pkg

      - run: pnpm check

      - run: pnpm test

      - run: pnpm --filter @camox/template-default test:production

      # Refreshes a local stand-in for template-default, installing from npm.
      - run: pnpm --filter @camox/cli test:network

      - name: Build dashboard
        run: pnpm nx run dashboard:build
        env:
          VITE_API_URL: https://api.camox.dev

      - name: Validate API bundle before changing production
        run: |
          pnpm --filter @camox/api exec wrangler deploy --dry-run --minify --config sandbox/wrangler.jsonc
          pnpm --filter @camox/api exec wrangler deploy --dry-run --minify --config release-sandbox/wrangler.jsonc
          pnpm --filter @camox/api exec wrangler deploy --dry-run --minify

      - name: Validate dispatch Worker bundle before changing production
        run: pnpm --filter @camox/dispatch exec wrangler deploy --dry-run --minify

      # Deploys the code mode and release sandbox Workers first, as the API binds their Durable
      # Objects. Building the release sandbox's Container image needs Docker, which the runner has.
      - name: Migrate database and deploy API
        run: pnpm --filter @camox/api deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Check API and database health
        run: |
          curl --fail --silent --show-error \
            --retry 10 --retry-all-errors --retry-delay 5 \
            --connect-timeout 10 --max-time 20 \
            https://api.camox.dev/health

      - name: Deploy dashboard
        run: pnpm --filter dashboard exec wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # This build syncs production definitions and must use the deployed API.
      - name: Release and deploy landing
        run: pnpm --filter landing deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CAMOX_DEPLOY_TOKEN: ${{ secrets.CAMOX_DEPLOY_TOKEN }}

      # Serves projects' websites at <slug>.camox.site; apps/dispatch/README.md has its setup.
      - name: Deploy dispatch Worker
        run: pnpm --filter @camox/dispatch run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Needing deploy means a failed or skipped deploy skips the publish.
  publish:
    needs: [deploy, release-please]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm nx run-many -t build --projects=tag:type:pkg

      - name: Publish @camox/api-contract
        run: pnpm publish --no-git-checks --access public
        working-directory: packages/api-contract
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @camox/ui
        run: pnpm publish --no-git-checks --access public
        working-directory: packages/ui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @camox/cli
        run: pnpm publish --no-git-checks --access public
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish create-camox
        run: pnpm publish --no-git-checks --access public
        working-directory: packages/create-camox
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish camox
        run: pnpm publish --no-git-checks --access public
        working-directory: packages/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Pushes the Template at the version just published to template-default on Cloudflare Artifacts;
  # packages/cli/scripts/README.md has its setup.
  refresh-template:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh template-default
        run: node packages/cli/scripts/refresh-template-artifacts.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
