# On every push to main, release-please only updates its release PR. Merging that PR cuts a
# release, which runs the checks and tests, deploys Camox, then publishes the SDK. Publishing
# waits for the deploy of the same commit, so no published SDK is ahead of the deployed API
# (ADR 0019). Each publish uploads its skills for the agent, refreshes the Template that new
# projects fork, then upgrades every project to it. Running the workflow by hand deploys main
# without a release.
name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Only main writes to the shared Nx cache; PR runs get a cache scoped to the PR.
env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  # Gates the deploy, split across runners: the API's integration tests alone take about 25
  # CPU-minutes, which one runner's 4 vCPUs would run in about 10.
  test:
    needs: release-please
    if: ${{ github.ref == 'refs/heads/main' && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    name: test (${{ matrix.suite }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - suite: checks
          - suite: workspace
          # The API's `test-shard-*` Nx targets (apps/api/package.json).
          - suite: api
            shard: 1
          - suite: api
            shard: 2
          - suite: api
            shard: 3
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The API's tests import its workspace dependencies from source, so only the others build.
      - if: ${{ matrix.suite != 'api' }}
        run: pnpm nx run-many -t build --projects=tag:type:pkg

      - if: ${{ matrix.suite == 'checks' }}
        run: pnpm check

      - name: Validate API bundle before changing production
        if: ${{ matrix.suite == 'checks' }}
        run: |
          pnpm --filter @camox/api exec wrangler deploy --dry-run --minify --config sandbox/wrangler.jsonc
          pnpm --filter @camox/api exec wrangler deploy --dry-run --minify --config release-sandbox/wrangler.jsonc
          pnpm --filter @camox/api exec wrangler deploy --dry-run --minify

      - name: Validate dispatch Worker bundle before changing production
        if: ${{ matrix.suite == 'checks' }}
        run: pnpm --filter @camox/dispatch exec wrangler deploy --dry-run --minify

      - if: ${{ matrix.suite == 'workspace' }}
        run: pnpm nx run-many -t test --all --exclude=@camox/api

      - if: ${{ matrix.suite == 'workspace' }}
        run: pnpm --filter @camox/template-default test:production

      # Refreshes a local stand-in for template-default, installing from npm.
      - if: ${{ matrix.suite == 'workspace' }}
        run: pnpm --filter @camox/cli test:network

      - if: ${{ matrix.suite == 'api' }}
        run: pnpm nx run @camox/api:test-shard-${{ matrix.shard }}

  deploy:
    needs: [release-please, test]
    if: ${{ github.ref == 'refs/heads/main' && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    # Finish an active deployment; a newer release may replace a pending one.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Validate deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CAMOX_DEPLOY_TOKEN: ${{ secrets.CAMOX_DEPLOY_TOKEN }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CAMOX_DEPLOY_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing production secret: $name"
              exit 1
            fi
          done

      - run: pnpm install --frozen-lockfile

      # Build local workspace packages, including the unpublished SDK and CLI.
      - run: pnpm nx run-many -t build --projects=tag:type:pkg

      # The publish job publishes these builds, taken before the dashboard's build rebuilds any.
      - name: Keep package builds for publishing
        if: ${{ needs.release-please.outputs.release_created == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: package-builds
          path: |
            packages/api-contract/dist
            packages/ui/dist
            packages/cli/dist
            packages/sdk/dist
          if-no-files-found: error
          retention-days: 7

      - name: Build dashboard
        run: pnpm nx run dashboard:build
        env:
          VITE_API_URL: https://api.camox.ai

      # Serves projects' websites at <slug>.camox.site; apps/dispatch/README.md has its setup.
      # Deployed before the API, which binds its `CamoxRevisions` entrypoint. Dispatch binds the
      # API's `CamoxPreviews` entrypoint in turn: until the API deploys it, dispatch's member
      # checks and live Worker reads fail, so drafts' runtime reads reach Live's code and websites
      # their release's Worker.
      - name: Deploy dispatch Worker
        run: pnpm --filter @camox/dispatch run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Deploys the code mode and release sandbox Workers first, as the API binds their Durable
      # Objects. Building the release sandbox's Container image needs Docker, which the runner has.
      - name: Migrate database and deploy API
        run: pnpm --filter @camox/api deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Check API and database health
        run: |
          curl --fail --silent --show-error \
            --retry 10 --retry-all-errors --retry-delay 5 \
            --connect-timeout 10 --max-time 20 \
            https://api.camox.ai/health

      - name: Deploy dashboard
        run: pnpm --filter dashboard exec wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # This build syncs production definitions and must use the deployed API.
      - name: Release and deploy landing
        run: pnpm --filter landing deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CAMOX_DEPLOY_TOKEN: ${{ secrets.CAMOX_DEPLOY_TOKEN }}

  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release-please
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Needing deploy means a failed or skipped deploy skips the publish.
  publish:
    needs: [deploy, release-please]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      # pnpm publish reads workspace dependencies' versions from node_modules.
      - run: pnpm install --frozen-lockfile

      # The deploy job's builds of the same commit.
      - uses: actions/download-artifact@v4
        with:
          name: package-builds
          path: packages

      - name: Publish @camox/api-contract
        run: pnpm publish --no-git-checks --access public
        working-directory: packages/api-contract
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @camox/ui
        run: pnpm publish --no-git-checks --access public
        working-directory: packages/ui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @camox/cli
        run: pnpm publish --no-git-checks --access public
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish create-camox
        run: pnpm publish --no-git-checks --access public
        working-directory: packages/create-camox
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish camox
        run: pnpm publish --no-git-checks --access public
        working-directory: packages/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Uploads the skills of the version just published to the API's `camox-skills` bucket, which the
  # agent mounts at the version a project's lockfile installs (apps/api/src/domains/code/skills.ts).
  # The Template refresh and the Upgrades wait for it, so no project installs a version the bucket
  # lacks.
  upload-skills:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Upload the skills
        run: pnpm --filter @camox/api skills:upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Pushes the Template at the version just published to template-default on Cloudflare Artifacts;
  # packages/cli/scripts/README.md has its setup.
  refresh-template:
    needs: upload-skills
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh template-default
        run: node packages/cli/scripts/refresh-template-artifacts.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Moves every project to the SDK just published, once new projects fork it, with the API's
  # `camox-upgrade` Workflow (apps/api/src/domains/upgrades/README.md). Projects that build are
  # pushed to `main` and released; the Workflow emails the ones that don't.
  upgrade-projects:
    needs: refresh-template
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Start the upgrade
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          version=$(node -p 'require("./packages/sdk/package.json").version')
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data "{\"params\":{\"camoxVersion\":\"$version\"}}" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workflows/camox-upgrade/instances"
