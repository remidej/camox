packages:
  - "apps/*"
  - "packages/*"
catalog:
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  react: ^19.3.1
  react-dom: ^19.3.1
  tsrs: 0.20.1-ts7.1.0-beta
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  vitest: 5.0.5
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
allowBuilds:
  "@google/genai": false
  "@openrouter/sdk": true
  "@parcel/watcher": true
  core-js: true
  core-js-pure: false
  esbuild: true
  msw: true
  nx: true
  protobufjs: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  - agents@0.29.0
patchedDependencies:
  "@cloudflare/ci@0.2.0": patches/@cloudflare__ci@0.2.0.patch
