packages:
  - "apps/*"
  - "packages/*"
  - "packages/cli/template"
catalog:
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  react: ^19.3.0
  react-dom: ^19.3.0
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: ^0.1.21
  vitest: npm:@voidzero-dev/vite-plus-test@latest
overrides:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.7
  vitest: npm:@voidzero-dev/vite-plus-test@0.1.21
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
allowBuilds:
  "@openrouter/sdk": true
  "@parcel/watcher": true
  core-js: true
  esbuild: true
  msw: true
  nx: true
  protobufjs: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  - "@tanstack/ai-event-client@0.3.10"
  - "@tanstack/ai@0.21.3"
